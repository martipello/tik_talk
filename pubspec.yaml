name: tik_talk
description: "TikTalk - a free, no-ads stopwatch and interval timer with voice announcements, by Seal Studios. Vibe-coded end to end, and free forever."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^17.5.0
  flex_color_scheme: ^8.4.0
  flutter_tts: ^4.2.5
  sqflite: ^2.4.2+1
  path: ^1.9.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  segment_display: ^0.6.0
  oc_liquid_glass: ^0.3.0
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Configuration for the flutter_launcher_icons package.
# Run `dart run flutter_launcher_icons` to (re)generate app icons for all platforms.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#000000"

# Configuration for the flutter_native_splash package.
# Run `dart run flutter_native_splash:create` to (re)generate splash screens for all platforms.
flutter_native_splash:
  color: "#000000"
  image: assets/icon/icon.png
  android: true
  web: true
  android_12:
    image: assets/icon/icon.png
    color: "#000000"

flutter:
  uses-material-design: true

  shaders:
    - shaders/liquid_slosh.frag

  assets:
    - assets/icon/icon.png
    - assets/fonts/
