name: Deploy Web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment, cancelling any in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3
      - run: flutter pub get
      - run: flutter pub run build_runner build --delete-conflicting-outputs
      # --base-href matches a project-pages URL (https://<user>.github.io/tik_talk/)
      # rather than a custom domain at the root - drop this flag (or set it
      # to "/") if a CNAME/custom domain is configured instead.
      - run: flutter build web -t lib/main_web.dart --release --base-href "/tik_talk/"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
